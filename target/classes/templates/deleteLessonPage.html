<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>reg form</title> 
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="icon" href="/images/favicon-32x32.png" sizes="any" type="image/png"/> 
    <style>
      body {
        min-width: 460px; 
        background: #FFDB89;
        font-family: Helvetica;
        /*overflow-x: hidden; */
      } 
      .reg { 
        width: 30%; 
        /*height: 70%; */
        background: #FFF8CC;
        color: rgba(128, 0, 0, 1); 
        font-size: 17px; 
        font-weight: bold;
        text-align: center; 
        box-shadow: 0 9px 10px rgba(0, 0, 0, 0.4); 
        border-radius: 12px; 
        padding: 20px 10px 10px 10px; 
        margin: 50px auto 0 35%; 
      } 
      .header { 
        height: 50px; 
        padding: 5px 0px 0px 0px;
      } 
      .naming-and-field { 
        display: flex;  
      }
      .naming { 
        width: 85px; 
        margin: 10px 0 0 0; 
      }
      .field { 
        width: 74%; 
        height: 30px; 
        font-size: 17px; 
        margin: 0 0 8px 0;
      }
      .download-button { 
        /*width: 250px; */ 
        height: 38px; 
        margin: 10px 0px 25px auto;       
        padding: 10px 50px;
        color: white;
        border: none;
        border-radius: 12px; 
        font-size: 18px;
        font-weight: bold;  
        background-color: #4CAF50;                
        position: relative;
        top: 0;        
        box-shadow: 0 5px 0 #2E7D32, 0 9px 10px rgba(0, 0, 0, 0.4);   
        transition: all 0.1s ease; 
      }
      .download-button:active {
        top: 5px; 
        box-shadow: 0 0 0 #2E7D32, 0 0 5px rgba(0, 0, 0, 0.4);
      }  
      .string { 
        font-size: 20px; 
        margin: 0 0 8px 0; 
      } 
      .small-string { 
        font-size: 17px; 
        margin: 0 0 2px 0; 
      } 
      .header-string { 
        font-size: 17px; 
        color: red; 
        margin: 0 0 2px 0; 
      } 

      
    </style>
  </head>

  <body> 
    <div class="reg"> 
      <!-- имя пользователя -->
      <div style="display:none;" th:text="${userName}" id="userNameData"> </div>

      <div  style="display:none;"
            th:text="${lessonId}" 
            id="info">                
      </div>       
      <br> <br> 

      <div class="small-string">
        Вы уверены, что хотите удалить этот урок? 
      </div> 
      
      <form action="/reallyDeleteLesson" method="post"> 
        <input style="display:none !important;" 
              type="hidden" 
              name="lessonId" 
              th:value="${lessonId}"> 
        <input style="display:none !important;" 
              type="hidden" 
              name="userName" 
              th:value="${userName}">
        <button class="download-button" type="submit" >
          удалить
        </button>  
      </form> 
      <br> <br> 

      <div class="small-string"> 
        Передумали? 
      </div> 

      <form action="/showLessonList" method="get"> 
        <input style="display:none !important;" 
              type="hidden" 
              name="userName" 
              th:value="${userName}">
        <button class="download-button" type="submit">
          вернуться к списку
        </button>  
      </form>   
      <br> 
    </div> 

  </body> 
</html>
